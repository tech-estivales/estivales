<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Estivales du Moulin — Commande</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', Arial, sans-serif;
      background: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      max-width: 340px;
      width: 100%;
    }
    .logo { font-size: 56px; margin-bottom: 12px; }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #1a6b75;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 36px;
    }
    .btn {
      display: block;
      background: linear-gradient(135deg, #f5a623, #e8941a);
      color: white;
      padding: 20px 40px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.03em;
      box-shadow: 0 4px 16px rgba(245,166,35,0.4);
      margin-bottom: 16px;
    }
    .btn:active { opacity: 0.85; }
    .note {
      font-size: 12px;
      color: #bbb;
      margin-top: 8px;
      line-height: 1.5;
    }
    .note b { color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌿</div>
    <div class="title">Les Estivales du Moulin</div>
    <div class="subtitle">Commande en ligne</div>
    <a class="btn" href="https://estivales.serveusercontent.com/pos/self-order/2?access_token=605e2cc3a45f4b53">
      🍽️ Accéder au menu
    </a>
    <p class="note">
      Si une alerte de sécurité apparaît,<br>
      appuyez sur <b>"Visiter le site"</b> pour continuer.
    </p>
  </div>
</body>
</html>
